    - data:
        isInLoop: false
        sourceType: start
        targetType: parameter-extractor
      id: start-extract_params
      source: start
      sourceHandle: source
      target: extract_params
      targetHandle: target
      type: custom
    - data:
        isInLoop: false
        sourceType: parameter-extractor
        targetType: code
      id: extract_params-normalize_inputs
      source: extract_params
      sourceHandle: source
      target: normalize_inputs
      targetHandle: target
      type: custom
    - data:
