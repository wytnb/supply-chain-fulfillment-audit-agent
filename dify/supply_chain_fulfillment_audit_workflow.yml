    - data:
        title: D01 Facts Builder
        desc: |-
          【作用】
          把 D01 的 OMS/WMS 工具回包统一解析成业务事实，并处理 `picking_timeout -> order_not_shipped_timeout` 的异常类型归一化。
          【输入】
          读取 D01 所有工具节点的 `json` 输出，以及库存迭代节点的 `output` 数组。
          【处理】
          解析 `success/code/message/data/trace`，生成结构化 `tool_results`、`rule_query`、`audit_summary`、`suggested_actions`、`responsible_department`、`ticket_action`。
          【输出】
          输出可直接用于知识检索和最终汇总的中间字段。
          【异常分支】
          任一工具失败时不会抛异常，而是把失败详情保留在 `tool_results` 并生成降级审计说明。
        type: code
        code_language: python3
        variables:
        - variable: query
          value_selector:
          - normalize_inputs
          - query
        - variable: order_detail
          value_selector:
          - d01_order_detail
          - json
        - variable: order_status
          value_selector:
          - d01_order_status
          - json
        - variable: payment_status
          value_selector:
          - d01_payment_status
          - json
        - variable: order_items
          value_selector:
          - d01_order_items
          - json
        - variable: inventory_list
          value_selector:
          - d01_inventory_iteration
          - output
        - variable: inventory_lock
          value_selector:
          - d01_inventory_lock
          - json
        - variable: warehouse_progress
          value_selector:
          - d01_warehouse_progress
          - json
        - variable: outbound_record
          value_selector:
          - d01_outbound_record
          - json
        - variable: blockers
          value_selector:
          - d01_blockers
          - json
        outputs:
          scenario_code:
            type: string
            children: null
          intent_code:
            type: string
            children: null
          exception_type:
            type: string
            children: null
          responsible_department:
            type: string
            children: null
          audit_summary:
            type: string
            children: null
          suggested_actions:
            type: array[string]
            children: null
          customer_reply:
            type: string
            children: null
          tool_results:
            type: object
            children: null
          rule_query:
            type: string
            children: null
          ticket_action:
            type: string
            children: null
          ticket_order_no:
            type: string
            children: null
        code: |
          def unpack(tool_result):
              if not isinstance(tool_result, dict):
                  return False, "INVALID_NODE_OUTPUT", {}, {}
              return bool(tool_result.get("success")), tool_result.get("code", ""), tool_result.get("data", {}) or {}, tool_result

          def main(query, order_detail, order_status, payment_status, order_items, inventory_list, inventory_lock, warehouse_progress, outbound_record, blockers):
              od_ok, _, od_data, od_raw = unpack(order_detail)
              os_ok, _, os_data, os_raw = unpack(order_status)
              ps_ok, _, ps_data, ps_raw = unpack(payment_status)
              oi_ok, _, oi_data, oi_raw = unpack(order_items)
              il_ok, _, il_data, il_raw = unpack(inventory_lock)
              wp_ok, _, wp_data, wp_raw = unpack(warehouse_progress)
              ob_ok, _, ob_data, ob_raw = unpack(outbound_record)
              bl_ok, _, bl_data, bl_raw = unpack(blockers)

              shortage_qty = int(il_data.get("shortage_qty") or 0)
              lock_failed = il_data.get("lock_status") == "LOCK_FAILED"
              blocker_exception_type = bl_data.get("exception_type") or ""
              outbound_status = ob_data.get("outbound_status") or ""
              warehouse_node = wp_data.get("current_node") or ""
              fulfillment_status = od_data.get("fulfillment_status") or ""
              if shortage_qty > 0 or lock_failed:
                  exception_type = "inventory_shortage"
                  responsible_department = "inventory_planning"
                  audit_summary = "订单未发货且锁库或库存快照显示存在缺货风险，当前更接近库存不足场景。"
                  suggested_actions = [
                      "优先核查缺货 SKU 的补货 ETA",
                      "评估跨仓调拨或拆单发货方案",
                  ]
                  customer_reply = "订单当前存在库存处理异常，系统建议先核查补货或调拨方案后再更新客户发货时效。"
                  ticket_action = "create"
              else:
                  exception_type = "order_not_shipped_timeout"
                  responsible_department = "warehouse" if blocker_exception_type == "picking_timeout" or warehouse_node in {"PICKING", "PACKING", "REVIEW"} else "manual_review"
                  audit_summary = "订单已支付但仍停留在仓内处理链路，未形成正常出库发运结果。"
                  suggested_actions = [
                      "立即核查仓储任务当前节点和责任人",
                      "确认出库单是否创建失败或被仓内阻塞",
                  ]
                  customer_reply = "订单目前仍在仓内处理链路，系统建议优先核查拣货或出库节点后再向客户更新时效。"
                  ticket_action = "create" if fulfillment_status in {"WAITING_WAREHOUSE", "WAITING_SHIPMENT"} else "skip"

              tool_results = {
                  "oms_get_order_detail": od_raw,
                  "oms_get_order_status": os_raw,
                  "oms_get_payment_status": ps_raw,
                  "oms_get_order_items": oi_raw,
                  "wms_get_inventory_snapshot_iteration": inventory_list or [],
                  "wms_get_inventory_lock_detail": il_raw,
                  "wms_get_order_warehouse_progress": wp_raw,
                  "wms_get_outbound_record": ob_raw,
                  "wms_check_fulfillment_blockers": bl_raw,
              }

              rule_query = f"场景: late_shipment; 用户问题: {query}; 异常类型: {exception_type}; 责任部门: {responsible_department}; 仓内节点: {warehouse_node}; 出库状态: {outbound_status}; 阻塞原因: {bl_data.get('exception_reason', '')}"

              return {
                  "scenario_code": "late_shipment",
                  "intent_code": "late_shipment_diagnosis",
                  "exception_type": exception_type,
                  "responsible_department": responsible_department,
                  "audit_summary": audit_summary,
                  "suggested_actions": suggested_actions,
                  "customer_reply": customer_reply,
                  "tool_results": tool_results,
                  "rule_query": rule_query,
                  "ticket_action": ticket_action,
                  "ticket_order_no": od_data.get("order_no", ""),
              }
      height: 126
      id: d01_facts
      position:
        x: 4280
        y: 580
      positionAbsolute:
        x: 4280
        y: 580
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 300
