    - data:
        title: D02 Summary / Decision
        desc: |-
          【作用】
          形成 D02 的最终审计摘要、建议动作和建单决策。
          【输入】
          读取 D02 事实节点与规则检索结果。
          【处理】
          输出统一字段，并在无知识命中时追加降级说明。
          【输出】
          输出可直接进入 Ticket Gate 和最终输出节点的标准字段。
          【异常分支】
          若知识库为空，不影响业务结论输出。
        type: code
        code_language: python3
        variables:
        - variable: facts
          value_selector:
          - d02_facts
        - variable: rule_evidence
          value_selector:
          - d02_knowledge
          - result
        outputs:
          scenario_code:
            type: string
            children: null
          intent_code:
            type: string
            children: null
          exception_type:
            type: string
            children: null
          responsible_department:
            type: string
            children: null
          audit_summary:
            type: string
            children: null
          suggested_actions:
            type: array[string]
            children: null
          customer_reply:
            type: string
            children: null
          rule_evidence:
            type: array[object]
            children: null
          tool_results:
            type: object
            children: null
          ticket_action:
            type: string
            children: null
          ticket_order_no:
            type: string
            children: null
        code: |
          def main(facts, rule_evidence):
              facts = facts or {}
              evidence = rule_evidence if isinstance(rule_evidence, list) else []
              audit_summary = facts.get("audit_summary", "")
              if not evidence:
                  audit_summary += " 当前未命中库存规则片段，建议人工复核补货与调拨策略。"
              return {
                  "scenario_code": facts.get("scenario_code", ""),
                  "intent_code": facts.get("intent_code", ""),
                  "exception_type": facts.get("exception_type", ""),
                  "responsible_department": facts.get("responsible_department", ""),
                  "audit_summary": audit_summary,
                  "suggested_actions": facts.get("suggested_actions", []),
                  "customer_reply": facts.get("customer_reply", ""),
                  "rule_evidence": evidence,
                  "tool_results": facts.get("tool_results", {}),
                  "ticket_action": facts.get("ticket_action", "skip"),
                  "ticket_order_no": facts.get("ticket_order_no", ""),
              }
