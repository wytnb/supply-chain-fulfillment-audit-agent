          ticket_waybill_no:
            type: string
            children: null
        code: |
          def main(facts, rule_evidence):
              facts = facts or {}
              evidence = rule_evidence if isinstance(rule_evidence, list) else []
              audit_summary = facts.get("audit_summary", "")
              if not evidence:
                  audit_summary += " 当前未命中异常签收规则片段，请人工复核举证和赔付条件。"
              return {
                  "scenario_code": facts.get("scenario_code", ""),
                  "intent_code": facts.get("intent_code", ""),
                  "exception_type": facts.get("exception_type", ""),
                  "responsible_department": facts.get("responsible_department", ""),
                  "audit_summary": audit_summary,
                  "suggested_actions": facts.get("suggested_actions", []),
                  "customer_reply": facts.get("customer_reply", ""),
                  "rule_evidence": evidence,
                  "tool_results": facts.get("tool_results", {}),
                  "ticket_action": facts.get("ticket_action", "skip"),
                  "ticket_order_no": facts.get("ticket_order_no", ""),
                  "ticket_waybill_no": facts.get("ticket_waybill_no", ""),
              }
