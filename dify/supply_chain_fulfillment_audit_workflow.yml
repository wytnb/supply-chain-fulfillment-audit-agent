        desc: |-
          【作用】
          形成运费审核场景的最终结论与建单决策。
          【输入】
          读取 D05 事实字段与规则命中结果。
          【处理】
          输出统一审计字段；仅当差异金额不为 0 时保留 `freight_bill_difference` 工单建单动作。
          【输出】
          输出 D05 标准字段。
          【异常分支】
          无。
        type: code
        code_language: python3
        variables:
        - variable: facts
          value_selector:
          - d05_facts
        - variable: rule_evidence
          value_selector:
          - d05_knowledge
          - result
        outputs:
          scenario_code:
            type: string
            children: null
          intent_code:
            type: string
            children: null
          exception_type:
            type: string
            children: null
          responsible_department:
            type: string
            children: null
          audit_summary:
            type: string
            children: null
          suggested_actions:
            type: array[string]
            children: null
          customer_reply:
            type: string
            children: null
          rule_evidence:
            type: array[object]
            children: null
          tool_results:
            type: object
            children: null
          ticket_action:
            type: string
            children: null
          ticket_order_no:
            type: string
            children: null
          ticket_waybill_no:
            type: string
            children: null
        code: |
          def main(facts, rule_evidence):
              facts = facts or {}
              evidence = rule_evidence if isinstance(rule_evidence, list) else []
              audit_summary = facts.get("audit_summary", "")
              if not evidence:
                  audit_summary += " 当前未命中费用或 SLA 规则片段，请人工复核结算口径。"
              return {
                  "scenario_code": facts.get("scenario_code", ""),
                  "intent_code": facts.get("intent_code", ""),
                  "exception_type": facts.get("exception_type", ""),
                  "responsible_department": facts.get("responsible_department", ""),
                  "audit_summary": audit_summary,
                  "suggested_actions": facts.get("suggested_actions", []),
                  "customer_reply": facts.get("customer_reply", ""),
                  "rule_evidence": evidence,
                  "tool_results": facts.get("tool_results", {}),
                  "ticket_action": facts.get("ticket_action", "skip"),
                  "ticket_order_no": facts.get("ticket_order_no", ""),
                  "ticket_waybill_no": facts.get("ticket_waybill_no", ""),
              }
