    - data:
        title: D03 Facts Builder
        desc: |-
          【作用】
          解析 D03 所有运输与结算工具结果，形成轨迹停滞诊断、扣罚建议和建单决策。
          【输入】
          读取运单详情、轨迹事件、停滞判断、承运商 SLA、扣罚计算和可选的运单反查结果。
          【处理】
          统一解析工具回包，生成 `tracking_stagnation` 场景的审计字段和规则检索 query。
          【输出】
          输出标准审计字段、`rule_query`、`ticket_action`、`ticket_order_no`、`ticket_waybill_no`。
          【异常分支】
          即使工具部分失败，也会输出结构化降级说明。
        type: code
        code_language: python3
        variables:
        - variable: query
          value_selector:
          - normalize_inputs
          - query
        - variable: waybill_lookup
          value_selector:
          - d03_waybill_by_order
          - json
        - variable: shipment_detail
          value_selector:
          - d03_shipment_detail
          - json
        - variable: tracking_events
          value_selector:
          - d03_tracking_events
          - json
        - variable: stagnation
          value_selector:
          - d03_stagnation
          - json
        - variable: carrier_profile
          value_selector:
          - d03_carrier_profile
          - json
        - variable: timeout_penalty
          value_selector:
          - d03_timeout_penalty
          - json
        outputs:
          scenario_code:
            type: string
            children: null
          intent_code:
            type: string
            children: null
          exception_type:
            type: string
            children: null
          responsible_department:
            type: string
            children: null
          audit_summary:
            type: string
            children: null
          suggested_actions:
            type: array[string]
            children: null
          customer_reply:
            type: string
            children: null
          tool_results:
            type: object
            children: null
          rule_query:
            type: string
            children: null
          ticket_action:
            type: string
            children: null
          ticket_order_no:
            type: string
            children: null
          ticket_waybill_no:
            type: string
            children: null
        code: |
          def data_of(tool_result):
              return (tool_result or {}).get("data", {}) if isinstance(tool_result, dict) else {}

          def main(query, waybill_lookup, shipment_detail, tracking_events, stagnation, carrier_profile, timeout_penalty):
              ship = data_of(shipment_detail)
              stag = data_of(stagnation)
              penalty = data_of(timeout_penalty)
              waybill = ship.get("waybill_no") or data_of(waybill_lookup).get("waybill_no") or ""
              order_no = ship.get("order_no") or data_of(waybill_lookup).get("order_no") or ""
              is_stagnated = bool(stag.get("is_stagnated"))
              is_timeout = bool(penalty.get("is_timeout"))
              audit_summary = "运单轨迹长时间无更新，且需要结合 SLA 与扣罚规则进行运输异常审计。"
              suggested_actions = [
                  "向承运商发起催办并确认最近轨迹节点",
                  "按 SLA 规则评估是否触发超时扣罚或升级处理",
              ]
              customer_reply = "运单当前存在运输时效异常，系统建议先完成承运商催办与 SLA 校验，再向客户同步最新处理进度。"
              ticket_action = "create" if is_stagnated or is_timeout else "skip"
              rule_query = f"场景: tracking_stagnation; 用户问题: {query}; 是否停滞: {is_stagnated}; 超时小时: {penalty.get('timeout_hours')}; 扣罚金额: {penalty.get('penalty_amount')}"
              return {
                  "scenario_code": "tracking_stagnation",
                  "intent_code": "tracking_stagnation_check",
                  "exception_type": "tracking_stagnation",
                  "responsible_department": "logistics",
                  "audit_summary": audit_summary,
                  "suggested_actions": suggested_actions,
                  "customer_reply": customer_reply,
                  "tool_results": {
                      "tms_get_waybill_by_order": waybill_lookup or {},
                      "tms_get_shipment_detail": shipment_detail or {},
                      "tms_get_tracking_events": tracking_events or {},
                      "tms_check_tracking_stagnation": stagnation or {},
                      "tms_get_carrier_profile": carrier_profile or {},
                      "settlement_calculate_timeout_penalty": timeout_penalty or {},
                  },
                  "rule_query": rule_query,
                  "ticket_action": ticket_action,
                  "ticket_order_no": order_no,
                  "ticket_waybill_no": waybill,
              }
      height: 126
      id: d03_facts
      position:
        x: 3900
        y: 1440
      positionAbsolute:
        x: 3900
        y: 1440
      selected: false
      sourcePosition: right
      targetPosition: left
