    - data:
        title: D05 Facts Builder
        desc: |-
          【作用】
          解析 D05 的运单、承运商、重算金额和账单差异，形成运费审核结论。
          【输入】
          读取 D05 所有工具回包 JSON。
          【处理】
          统一输出 `freight_bill_difference` 结论、差异摘要、规则检索 query 和建单决策。
          【输出】
          输出标准审计字段、`ticket_action`、`ticket_order_no`、`ticket_waybill_no`。
          【异常分支】
          若账单金额冲突或规则不适用，会输出人工复核说明。
        type: code
        code_language: python3
        variables:
        - variable: query
          value_selector:
          - normalize_inputs
          - query
        - variable: shipment_detail
          value_selector:
          - d05_shipment_detail
          - json
        - variable: carrier_profile
          value_selector:
          - d05_carrier_profile
          - json
        - variable: calc_freight
          value_selector:
          - d05_calc_freight
          - json
        - variable: fee_breakdown
          value_selector:
          - d05_fee_breakdown
          - json
        - variable: bill_audit
          value_selector:
          - d05_bill_audit
          - json
        outputs:
          scenario_code:
            type: string
            children: null
          intent_code:
            type: string
            children: null
          exception_type:
            type: string
            children: null
          responsible_department:
            type: string
            children: null
          audit_summary:
            type: string
            children: null
          suggested_actions:
            type: array[string]
            children: null
          customer_reply:
            type: string
            children: null
          tool_results:
            type: object
            children: null
          rule_query:
            type: string
            children: null
          ticket_action:
            type: string
            children: null
          ticket_order_no:
            type: string
            children: null
          ticket_waybill_no:
            type: string
            children: null
        code: |
          def data_of(tool_result):
              return (tool_result or {}).get("data", {}) if isinstance(tool_result, dict) else {}

          def main(query, shipment_detail, carrier_profile, calc_freight, fee_breakdown, bill_audit):
              ship = data_of(shipment_detail)
              bill = data_of(bill_audit)
              difference_amount = float(bill.get("difference_amount") or 0)
              audit_summary = "系统已完成运费重算与账单差异审核，可根据差异金额和差异原因决定是否进入费用复核。"
              suggested_actions = [
                  "核对计费重、附加服务费与承运商账单口径",
                  "若差异成立，向财务或结算团队发起费用复核",
              ]
              ticket_action = "create" if difference_amount != 0 else "skip"
              return {
                  "scenario_code": "freight_bill_audit",
                  "intent_code": "freight_bill_audit",
                  "exception_type": "freight_bill_difference" if difference_amount != 0 else "",
                  "responsible_department": "finance",
                  "audit_summary": audit_summary,
                  "suggested_actions": suggested_actions,
                  "customer_reply": "",
                  "tool_results": {
                      "tms_get_shipment_detail": shipment_detail or {},
                      "tms_get_carrier_profile": carrier_profile or {},
                      "settlement_calculate_freight": calc_freight or {},
                      "settlement_get_fee_breakdown": fee_breakdown or {},
                      "settlement_audit_carrier_bill": bill_audit or {},
                  },
                  "rule_query": f"场景: freight_bill_audit; 用户问题: {query}; 差异金额: {difference_amount}; 差异原因: {bill.get('difference_reasons')}",
                  "ticket_action": ticket_action,
                  "ticket_order_no": ship.get("order_no", ""),
                  "ticket_waybill_no": ship.get("waybill_no", ""),
              }
      height: 126
      id: d05_facts
      position:
        x: 3350
        y: 2360
      positionAbsolute:
        x: 3350
        y: 2360
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 320
