    - data:
        title: D04 Resolve Order
        desc: |-
          【作用】
          统一产出 D04 后续必须使用的 `resolved_order_no` 与最终运单号，避免仅提供运单号时订单侧工具拿到空值。
          【输入】
          读取 `normalize_inputs.order_no`、`d04_resolve_waybill` 的解析结果以及 `d04_shipment_detail.json`。
          【处理】
          优先保留用户显式输入的 `order_no`；若为空则从 `tms_get_shipment_detail.data.order_no` 或查单回包中反推订单号，同时回填最终 `resolved_waybill_no`。
          【输出】
          输出 `resolved_order_no`、`resolved_waybill_no`、`resolution_status`，供订单详情、地址、签收状态和赔付工具消费。
          【异常分支】
          若仍无法解析订单号，则输出空值与 `resolution_status`，由事实节点继续给出人工复核导向。
        type: code
        code_language: python3
        variables:
        - variable: order_no
          value_selector:
          - normalize_inputs
          - order_no
        - variable: resolved_waybill
          value_selector:
          - d04_resolve_waybill
          - resolved_waybill_no
        - variable: lookup_order_no
          value_selector:
          - d04_resolve_waybill
          - resolved_order_no
        - variable: shipment_detail
          value_selector:
          - d04_shipment_detail
          - json
        outputs:
          resolved_order_no:
            type: string
            children: null
          resolved_waybill_no:
            type: string
            children: null
          resolution_status:
            type: string
            children: null
        code: |
          def main(order_no, resolved_waybill, lookup_order_no, shipment_detail):
              ship = shipment_detail if isinstance(shipment_detail, dict) else {}
              data = ship.get("data", {}) if isinstance(ship.get("data", {}), dict) else {}
              resolved_order_no = str(order_no or data.get("order_no") or lookup_order_no or "")
              resolved_waybill_no = str(resolved_waybill or data.get("waybill_no") or "")
              resolution_status = "resolved" if resolved_order_no and resolved_waybill_no else "partial"
              return {
                  "resolved_order_no": resolved_order_no,
                  "resolved_waybill_no": resolved_waybill_no,
                  "resolution_status": resolution_status,
              }
