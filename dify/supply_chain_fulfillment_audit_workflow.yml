    - data:
        title: D01 Order Facts / oms_get_order_detail
        desc: |-
          【作用】
          获取订单级基础事实，为晚发货诊断提供仓库、承运商、承诺发货时效等基线信息。
          【输入】
          读取归一化后的 `order_no`，并固定使用 `MCP Server ID = supplychain_fulfillment`、`tool_name = oms_get_order_detail`。
          【处理】
          调用 OMS 工具查询订单详情；返回的结构化结果保留在 Tool 节点的 `json` 字段供下游解析。
          【输出】
