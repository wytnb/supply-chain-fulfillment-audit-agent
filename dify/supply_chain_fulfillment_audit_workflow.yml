    - data:
        title: D02 Facts Builder
        desc: |-
          【作用】
          解析 D02 工具结果，得出库存不足结论、责任部门和建议动作。
          【输入】
          读取订单详情、订单商品、锁库回包和库存循环输出。
          【处理】
          识别 `inventory_shortage`、构建规则检索 query，并整理工具原始结果。
          【输出】
          输出标准审计字段、`rule_query` 和 `ticket_action`。
          【异常分支】
          工具失败会进入降级输出，但仍保持标准响应结构。
        type: code
        code_language: python3
        variables:
        - variable: query
          value_selector:
          - normalize_inputs
          - query
        - variable: order_detail
          value_selector:
          - d02_order_detail
          - json
        - variable: order_items
          value_selector:
          - d02_order_items
          - json
        - variable: inventory_lock
          value_selector:
          - d02_inventory_lock
          - json
        - variable: inventory_list
          value_selector:
          - d02_inventory_iteration
          - output
        outputs:
          scenario_code:
            type: string
            children: null
          intent_code:
            type: string
            children: null
          exception_type:
            type: string
            children: null
          responsible_department:
            type: string
            children: null
          audit_summary:
            type: string
            children: null
          suggested_actions:
            type: array[string]
            children: null
          customer_reply:
            type: string
            children: null
          tool_results:
            type: object
            children: null
          rule_query:
            type: string
            children: null
          ticket_action:
            type: string
            children: null
          ticket_order_no:
            type: string
            children: null
        code: |
          def main(query, order_detail, order_items, inventory_lock, inventory_list):
              data = (inventory_lock or {}).get("data", {}) if isinstance(inventory_lock, dict) else {}
              shortage_qty = int(data.get("shortage_qty") or 0)
              lock_status = data.get("lock_status") or ""
              audit_summary = "订单存在锁库失败或可用库存不足，符合库存不足导致无法发货的诊断路径。"
              suggested_actions = [
                  "优先确认缺货 SKU 的补货 ETA",
                  "评估跨仓调拨、拆单发货或延迟承诺方案",
              ]
              customer_reply = "订单当前存在库存处理异常，建议先完成补货或调拨判断后再同步客户新的发货安排。"
              tool_results = {
                  "oms_get_order_detail": order_detail or {},
                  "oms_get_order_items": order_items or {},
                  "wms_get_inventory_lock_detail": inventory_lock or {},
                  "wms_get_inventory_snapshot_iteration": inventory_list or [],
              }
              rule_query = f"场景: inventory_shortage; 用户问题: {query}; 锁库状态: {lock_status}; 缺货数量: {shortage_qty}"
              ticket_action = "create" if lock_status == "LOCK_FAILED" or shortage_qty > 0 else "skip"
              order_no = ((order_detail or {}).get("data", {}) or {}).get("order_no", "")
              return {
                  "scenario_code": "inventory_shortage",
                  "intent_code": "inventory_shortage_check",
                  "exception_type": "inventory_shortage",
                  "responsible_department": "inventory_planning",
                  "audit_summary": audit_summary,
                  "suggested_actions": suggested_actions,
                  "customer_reply": customer_reply,
                  "tool_results": tool_results,
                  "rule_query": rule_query,
                  "ticket_action": ticket_action,
                  "ticket_order_no": order_no,
              }
      height: 126
