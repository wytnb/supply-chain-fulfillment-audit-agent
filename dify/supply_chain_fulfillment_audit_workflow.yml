    nodes:
    - data:
        title: Start / User Input
        desc: |-
          【作用】
          作为统一入口接收用户问题和可选结构化字段，为后续参数提取与场景路由提供原始输入。
          【输入】
          该节点直接接收 `query`、`order_no`、`waybill_no`、`carrier_bill_amount`、`operator_role`。
          【处理】
          不做业务判断，只保证 Workflow 的输入表单固定且字段命名与后续节点一致。
          【输出】
          输出开始节点变量，供 `Intent & Parameter Extractor` 和 `Normalize Inputs` 使用。
          【异常分支】
          若 `query` 为空，后续节点会在缺参检查中返回 `missing_inputs`，不会继续执行工具调用。
        type: start
        variables:
        - variable: query
          label: query
          type: paragraph
          required: true
          description: 用户的自然语言问题，例如“订单 O-20260420-1001 为什么还没发货”
          max_length: 5000
        - variable: order_no
          label: order_no
          type: text-input
          required: false
          description: 可选。若用户已知订单号，可直接填写。
          max_length: 128
        - variable: waybill_no
          label: waybill_no
          type: text-input
          required: false
          description: 可选。若用户已知运单号，可直接填写。
          max_length: 128
        - variable: carrier_bill_amount
          label: carrier_bill_amount
          type: number
          required: false
          description: 可选。仅运费账单审核场景使用。
        - variable: operator_role
          label: operator_role
          type: text-input
          required: false
          description: 可选。默认按 customer_service 处理。
          max_length: 64
      height: 168
      id: start
      position:
        x: 20
        y: 280
      positionAbsolute:
        x: 20
        y: 280
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 280
    - data:
        title: Intent & Parameter Extractor
        desc: |-
          【作用】
          从自然语言问题中提取场景、意图和关键业务标识，降低用户必须手工填写结构化字段的门槛。
          【输入】
          读取 `query`，并尝试识别 `scenario_code`、`intent_code`、`order_no`、`waybill_no`、`carrier_bill_amount`。
          【处理】
          使用参数提取模型做受控结构化抽取；不直接决定最终字段优先级，显式表单值会在下游覆盖提取值。
          【输出】
          输出 `scenario_code`、`intent_code`、`order_no`、`waybill_no`、`carrier_bill_amount` 五类候选参数。
          【异常分支】
          若模型无法可靠提取，字段可为空；下游 `Normalize Inputs` 会做兜底归一化和缺参提示。
        type: parameter-extractor
        model:
          provider: openai
          name: gpt-4o-mini
          mode: chat
          completion_params: {}
        query: '{{#start.query#}}'
        reasoning_mode: prompt
        instruction: |-
          你是供应链履约审计参数提取器。只输出结构化字段，不要猜测不存在的单号。
          可用 `scenario_code` 只有：
          - late_shipment
          - inventory_shortage
          - tracking_stagnation
          - abnormal_signed
          - freight_bill_audit
          可用 `intent_code` 只有：
          - late_shipment_diagnosis
          - inventory_shortage_check
          - tracking_stagnation_check
          - abnormal_signed_check
          - freight_bill_audit
        parameters:
        - name: scenario_code
          type: string
          required: false
          description: 从 query 中提取的标准场景编码
        - name: intent_code
          type: string
          required: false
          description: 从 query 中提取的标准意图编码
        - name: order_no
          type: string
          required: false
          description: 从 query 中提取的订单号
        - name: waybill_no
          type: string
          required: false
          description: 从 query 中提取的运单号
        - name: carrier_bill_amount
          type: number
          required: false
          description: 从 query 中提取的承运商账单金额
      height: 152
      id: extract_params
      position:
        x: 340
        y: 280
      positionAbsolute:
        x: 340
        y: 280
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 280
    - data:
        title: Normalize Inputs
        desc: |-
          【作用】
          统一显式表单输入与模型提取结果，生成后续所有节点都使用的标准字段。
          【输入】
          读取开始节点的 `query`、显式 `order_no` / `waybill_no` / `carrier_bill_amount` / `operator_role`，以及参数提取器输出。
          【处理】
          按“显式字段优先、模型提取兜底”的规则合并输入；同时校验 `scenario_code` 并生成 `input_gate`、`route_key`、`missing_inputs`。
          【输出】
          输出归一化后的 `query`、`scenario_code`、`intent_code`、`order_no`、`waybill_no`、`carrier_bill_amount`、`operator_role`、`missing_inputs`、`input_gate`。
          【异常分支】
          若无法推断场景或关键参数不足，`input_gate` 会被置为 `missing`，下游直接返回缺参结果。
        type: code
        code_language: python3
        variables:
        - variable: query
          value_selector:
          - start
          - query
        - variable: input_order_no
          value_selector:
          - start
          - order_no
        - variable: input_waybill_no
          value_selector:
          - start
          - waybill_no
        - variable: input_bill_amount
          value_selector:
          - start
          - carrier_bill_amount
        - variable: input_operator_role
          value_selector:
          - start
          - operator_role
        - variable: extracted_scenario_code
          value_selector:
          - extract_params
          - scenario_code
        - variable: extracted_intent_code
          value_selector:
          - extract_params
          - intent_code
        - variable: extracted_order_no
          value_selector:
          - extract_params
          - order_no
        - variable: extracted_waybill_no
          value_selector:
          - extract_params
          - waybill_no
        - variable: extracted_bill_amount
          value_selector:
          - extract_params
          - carrier_bill_amount
        outputs:
          query:
            type: string
            children: null
          scenario_code:
            type: string
            children: null
          intent_code:
            type: string
            children: null
          order_no:
            type: string
            children: null
          waybill_no:
            type: string
            children: null
          carrier_bill_amount:
            type: number
            children: null
          operator_role:
            type: string
            children: null
          missing_inputs:
            type: array[string]
            children: null
          input_gate:
            type: string
            children: null
          route_key:
            type: string
            children: null
        code: |
          VALID_SCENARIOS = {
              "late_shipment": "late_shipment_diagnosis",
              "inventory_shortage": "inventory_shortage_check",
              "tracking_stagnation": "tracking_stagnation_check",
              "abnormal_signed": "abnormal_signed_check",
              "freight_bill_audit": "freight_bill_audit",
          }

          def clean_text(value):
              if value is None:
                  return ""
              if isinstance(value, str):
                  return value.strip()
              return str(value).strip()

          def pick_text(primary, secondary):
              return clean_text(primary) or clean_text(secondary)

          def main(
              query,
              input_order_no,
              input_waybill_no,
              input_bill_amount,
              input_operator_role,
              extracted_scenario_code,
              extracted_intent_code,
              extracted_order_no,
              extracted_waybill_no,
              extracted_bill_amount,
          ):
              normalized_query = clean_text(query)
              scenario_code = pick_text("", extracted_scenario_code)
              order_no = pick_text(input_order_no, extracted_order_no)
              waybill_no = pick_text(input_waybill_no, extracted_waybill_no)

              carrier_bill_amount = input_bill_amount
              if carrier_bill_amount in ("", None):
                  carrier_bill_amount = extracted_bill_amount

              operator_role = pick_text(input_operator_role, "customer_service")

              if scenario_code not in VALID_SCENARIOS:
                  if carrier_bill_amount not in ("", None) and waybill_no:
                      scenario_code = "freight_bill_audit"
                  elif waybill_no and any(token in normalized_query for token in ["签收", "未收到", "代收"]):
                      scenario_code = "abnormal_signed"
                  elif waybill_no:
                      scenario_code = "tracking_stagnation"
                  elif order_no and any(token in normalized_query for token in ["缺货", "库存", "锁库"]):
                      scenario_code = "inventory_shortage"
                  elif order_no:
                      scenario_code = "late_shipment"

              intent_code = pick_text(extracted_intent_code, VALID_SCENARIOS.get(scenario_code, ""))

              missing_inputs = []
              if not normalized_query:
                  missing_inputs.append("query")
              if not scenario_code:
                  missing_inputs.append("scenario_code")
              elif scenario_code in {"late_shipment", "inventory_shortage"} and not order_no:
                  missing_inputs.append("order_no")
              elif scenario_code == "tracking_stagnation" and not (waybill_no or order_no):
                  missing_inputs.append("waybill_no_or_order_no")
              elif scenario_code == "abnormal_signed" and not (waybill_no or order_no):
                  missing_inputs.append("waybill_no_or_order_no")
              elif scenario_code == "freight_bill_audit":
                  if not waybill_no:
                      missing_inputs.append("waybill_no")
                  if carrier_bill_amount in ("", None):
                      missing_inputs.append("carrier_bill_amount")

              input_gate = "missing" if missing_inputs else "ready"
              route_key = scenario_code or "unknown"

              return {
                  "query": normalized_query,
                  "scenario_code": scenario_code,
                  "intent_code": intent_code,
                  "order_no": order_no,
                  "waybill_no": waybill_no,
                  "carrier_bill_amount": float(carrier_bill_amount) if carrier_bill_amount not in ("", None) else 0.0,
                  "operator_role": operator_role,
                  "missing_inputs": missing_inputs,
                  "input_gate": input_gate,
                  "route_key": route_key,
              }
      height: 126
      id: normalize_inputs
      position:
        x: 670
        y: 280
      positionAbsolute:
        x: 670
        y: 280
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 280
    - data:
        title: Missing Required Inputs Check
        desc: |-
          【作用】
          判断归一化后的输入是否满足继续执行条件，并在缺参时阻断 MCP 与知识库节点。
          【输入】
          读取 `Normalize Inputs` 输出的 `input_gate` 和 `missing_inputs`。
          【处理】
          当 `input_gate` 为 `missing` 时进入缺参响应分支；为 `ready` 时进入场景路由。
          【输出】
          输出 `case_missing` 和 `case_ready` 两个分支信号。
          【异常分支】
          不抛出错误；所有缺参都走显式返回，避免工具节点产生误报。
        type: if-else
        cases:
        - case_id: case_missing
          logical_operator: and
          conditions:
          - id: cond_missing
            varType: string
            variable_selector:
            - normalize_inputs
            - input_gate
            comparison_operator: is
            value: missing
        - case_id: case_ready
          logical_operator: and
          conditions:
          - id: cond_ready
            varType: string
            variable_selector:
            - normalize_inputs
            - input_gate
            comparison_operator: is
            value: ready
      height: 174
      id: check_inputs
      position:
        x: 1000
        y: 280
      positionAbsolute:
        x: 1000
        y: 280
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 280
    - data:
        title: Missing Inputs Response Builder
        desc: |-
          【作用】
          将缺参结果整理成统一输出结构，确保 API 调用方和终端用户得到可解释反馈。
          【输入】
          读取归一化后的 `scenario_code`、`intent_code`、`missing_inputs`、`query` 和其他候选字段。
          【处理】
          生成统一的失败但可继续补参的审计响应，不调用任何 MCP 工具或知识库。
          【输出】
          输出与正常分支同结构的字段，只是 `audit_summary` 说明缺参，`ticket_draft` 为空。
          【异常分支】
          本节点本身不应失败；即使场景为空，也会返回缺参提示。
        type: code
        code_language: python3
        variables:
        - variable: scenario_code
          value_selector:
          - normalize_inputs
          - scenario_code
        - variable: intent_code
          value_selector:
          - normalize_inputs
          - intent_code
        - variable: missing_inputs
          value_selector:
          - normalize_inputs
          - missing_inputs
        outputs:
          scenario_code:
            type: string
            children: null
          intent_code:
            type: string
            children: null
          exception_type:
            type: string
            children: null
          responsible_department:
            type: string
            children: null
          audit_summary:
            type: string
            children: null
          suggested_actions:
            type: array[string]
            children: null
          customer_reply:
            type: string
            children: null
          ticket_draft:
            type: object
            children: null
          tool_results:
            type: object
            children: null
          rule_evidence:
            type: array[object]
            children: null
          missing_inputs:
            type: array[string]
            children: null
        code: |
          def main(scenario_code, intent_code, missing_inputs):
              return {
                  "scenario_code": scenario_code or "",
                  "intent_code": intent_code or "",
                  "exception_type": "",
                  "responsible_department": "manual_review",
                  "audit_summary": "输入信息不足，Workflow 已停止在缺参检查节点，请补充 missing_inputs 后重新运行。",
                  "suggested_actions": ["补充缺失字段后重试"],
                  "customer_reply": "当前信息不足，暂时无法完成审计，请补充订单号、运单号或账单金额等必要信息。",
                  "ticket_draft": {},
                  "tool_results": {},
                  "rule_evidence": [],
                  "missing_inputs": missing_inputs or [],
              }
      height: 126
      id: missing_build
      position:
        x: 1340
        y: 120
      positionAbsolute:
        x: 1340
        y: 120
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 300
    - data:
        title: Scenario Router
        desc: |-
          【作用】
          将已通过缺参校验的请求路由到五个固定 MVP 场景分支。
          【输入】
          读取 `route_key`，该值来自 `Normalize Inputs` 统一后的 `scenario_code`。
          【处理】
          根据标准场景编码选择 `late_shipment`、`inventory_shortage`、`tracking_stagnation`、`abnormal_signed`、`freight_bill_audit` 五条链路之一。
          【输出】
          输出五个显式分支句柄，供对应场景的第一个工具节点使用。
          【异常分支】
          若没有命中任何标准场景，则不会进入业务链路；该情况理论上已在缺参节点被拦截。
        type: if-else
        cases:
        - case_id: case_late_shipment
          logical_operator: and
          conditions:
          - id: cond_route_late
            varType: string
            variable_selector:
            - normalize_inputs
            - route_key
            comparison_operator: is
            value: late_shipment
        - case_id: case_inventory_shortage
          logical_operator: and
          conditions:
          - id: cond_route_inventory
            varType: string
            variable_selector:
            - normalize_inputs
            - route_key
            comparison_operator: is
            value: inventory_shortage
        - case_id: case_tracking_stagnation
          logical_operator: and
          conditions:
          - id: cond_route_tracking
            varType: string
            variable_selector:
            - normalize_inputs
            - route_key
            comparison_operator: is
            value: tracking_stagnation
        - case_id: case_abnormal_signed
          logical_operator: and
          conditions:
          - id: cond_route_abnormal
            varType: string
            variable_selector:
            - normalize_inputs
            - route_key
            comparison_operator: is
            value: abnormal_signed
        - case_id: case_freight_bill_audit
          logical_operator: and
          conditions:
          - id: cond_route_bill
            varType: string
            variable_selector:
            - normalize_inputs
            - route_key
            comparison_operator: is
            value: freight_bill_audit
      height: 334
      id: route_scenario
      position:
        x: 1340
        y: 280
      positionAbsolute:
        x: 1340
        y: 280
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 300
    - data:
        title: End / Missing Inputs
        desc: |-
          【作用】
          在缺参场景下向调用方输出统一结构，保证与正常场景返回格式一致。
          【输入】
          读取 `Missing Inputs Response Builder` 的全部标准输出字段。
          【处理】
          不再做任何业务处理，直接把缺参结果作为 Workflow 的最终输出。
          【输出】
          输出 `scenario_code`、`intent_code`、`exception_type`、`responsible_department`、`audit_summary`、`suggested_actions`、`customer_reply`、`ticket_draft`、`tool_results`、`rule_evidence`、`missing_inputs`。
          【异常分支】
          无额外异常分支；该节点是缺参路径的终点。
        type: end
        outputs:
        - variable: scenario_code
          value_selector:
          - missing_build
          - scenario_code
          value_type: string
        - variable: intent_code
          value_selector:
          - missing_build
          - intent_code
          value_type: string
        - variable: exception_type
          value_selector:
          - missing_build
          - exception_type
          value_type: string
        - variable: responsible_department
          value_selector:
          - missing_build
          - responsible_department
          value_type: string
        - variable: audit_summary
          value_selector:
          - missing_build
          - audit_summary
          value_type: string
        - variable: suggested_actions
          value_selector:
          - missing_build
          - suggested_actions
          value_type: array[string]
        - variable: customer_reply
          value_selector:
          - missing_build
          - customer_reply
          value_type: string
        - variable: ticket_draft
          value_selector:
          - missing_build
          - ticket_draft
          value_type: object
        - variable: tool_results
          value_selector:
          - missing_build
          - tool_results
          value_type: object
        - variable: rule_evidence
          value_selector:
          - missing_build
          - rule_evidence
          value_type: array[object]
        - variable: missing_inputs
          value_selector:
          - missing_build
          - missing_inputs
          value_type: array[string]
      height: 216
