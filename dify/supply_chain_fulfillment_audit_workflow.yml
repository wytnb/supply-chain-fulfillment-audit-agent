    - data:
        title: D04 Resolve Waybill
        desc: |-
          【作用】
          统一产出 D04 使用的 `resolved_waybill_no`，避免查单分支执行后下游仍读取空 `waybill_no`。
          【输入】
          读取 `normalize_inputs.waybill_no`、`normalize_inputs.order_no` 与 `d04_waybill_by_order.json`。
          【处理】
          若用户已提供 `waybill_no` 则直接沿用；否则从 `tms_get_waybill_by_order` 回包中补齐运单号，并同步保留可用的订单号。
          【输出】
          输出 `resolved_waybill_no`、`resolved_order_no`、`lookup_status`，供 `d04_shipment_detail` 和后续节点消费。
          【异常分支】
          若查询失败或仍未解析到运单号，则输出空值和 `lookup_status`，不在此节点中断流程。
        type: code
        code_language: python3
        variables:
        - variable: waybill_no
          value_selector:
          - normalize_inputs
          - waybill_no
        - variable: order_no
          value_selector:
          - normalize_inputs
          - order_no
        - variable: waybill_lookup
          value_selector:
          - d04_waybill_by_order
          - json
        outputs:
          resolved_waybill_no:
            type: string
            children: null
          resolved_order_no:
            type: string
            children: null
          lookup_status:
            type: string
            children: null
        code: |
          def main(waybill_no, order_no, waybill_lookup):
              lookup = waybill_lookup if isinstance(waybill_lookup, dict) else {}
              data = lookup.get("data", {}) if isinstance(lookup.get("data", {}), dict) else {}
              resolved_waybill_no = str(waybill_no or data.get("waybill_no") or "")
              resolved_order_no = str(order_no or data.get("order_no") or "")
              lookup_status = "provided" if waybill_no else ("resolved" if resolved_waybill_no else "missing")
              return {
                  "resolved_waybill_no": resolved_waybill_no,
                  "resolved_order_no": resolved_order_no,
                  "lookup_status": lookup_status,
              }
