    - data:
        title: D03 Resolve Waybill
        desc: |-
          【作用】
          统一产出 D03 后续节点必须使用的 `resolved_waybill_no`，避免查询补单号后仍继续使用空的 `waybill_no`。
          【输入】
          读取 `normalize_inputs.waybill_no` 和 `d03_waybill_by_order.json`，前置条件是已经完成缺参校验并进入 D03 分支。
          【处理】
          若用户已显式提供 `waybill_no` 则直接使用；否则优先从 `tms_get_waybill_by_order` 的 `data.waybill_no` 中补齐，并同时回填 `resolved_order_no` 供下游事实节点复用。
          【输出】
          输出 `resolved_waybill_no`、`resolved_order_no`、`lookup_status`，供 `d03_shipment_detail`、`d03_tracking_events`、`d03_stagnation`、`d03_timeout_penalty` 消费。
          【异常分支】
          若查单失败或仍拿不到运单号，不在此节点抛错，而是输出空值和结构化 `lookup_status`，由后续事实节点统一降级解释。
        type: code
        code_language: python3
        variables:
        - variable: waybill_no
          value_selector:
          - normalize_inputs
          - waybill_no
        - variable: order_no
          value_selector:
          - normalize_inputs
          - order_no
        - variable: waybill_lookup
          value_selector:
          - d03_waybill_by_order
          - json
        outputs:
          resolved_waybill_no:
            type: string
            children: null
          resolved_order_no:
            type: string
            children: null
          lookup_status:
            type: string
            children: null
        code: |
          def main(waybill_no, order_no, waybill_lookup):
              lookup = waybill_lookup if isinstance(waybill_lookup, dict) else {}
              data = lookup.get("data", {}) if isinstance(lookup.get("data", {}), dict) else {}
              resolved_waybill_no = str(waybill_no or data.get("waybill_no") or "")
              resolved_order_no = str(order_no or data.get("order_no") or "")
              lookup_status = "provided" if waybill_no else ("resolved" if resolved_waybill_no else "missing")
              return {
                  "resolved_waybill_no": resolved_waybill_no,
                  "resolved_order_no": resolved_order_no,
                  "lookup_status": lookup_status,
              }
