app:
  description: 统一总流程的供应链履约异常与运费结算审计 Workflow。该模板面向 Dify Workflow 导入，固定使用 MCP Server ID `supplychain_fulfillment`，并通过 5 个场景分支覆盖 D01-D05 主演示案例。
  icon: "\U0001F4E6"
  icon_background: '#E8F1FF'
  mode: workflow
  name: Supply Chain Fulfillment Audit Workflow
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.4.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      enabled: false
    opening_statement: ''
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
