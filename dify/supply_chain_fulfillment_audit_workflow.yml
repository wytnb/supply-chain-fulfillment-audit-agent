    - data:
        title: D04 Facts Builder
        desc: |-
          【作用】
          解析异常签收场景的订单、签收与赔付事实，生成 D04 的审计中间结果。
          【输入】
          读取运单补齐、运单详情、订单详情、地址、签收状态和赔付计算结果。
          【处理】
          统一输出 `abnormal_signed` 场景的摘要、规则检索 query、建议动作和建单决策。
          【输出】
          输出标准审计字段和 Ticket 所需字段。
          【异常分支】
          若赔付规则不适用或签收证据不足，会输出人工复核导向的降级说明。
        type: code
        code_language: python3
        variables:
        - variable: query
          value_selector:
          - normalize_inputs
          - query
        - variable: waybill_lookup
          value_selector:
          - d04_waybill_by_order
          - json
        - variable: shipment_detail
          value_selector:
          - d04_shipment_detail
          - json
        - variable: order_detail
          value_selector:
          - d04_order_detail
          - json
        - variable: order_address
          value_selector:
          - d04_order_address
          - json
        - variable: delivery_status
          value_selector:
          - d04_delivery_status
          - json
        - variable: compensation
          value_selector:
          - d04_compensation
          - json
        outputs:
          scenario_code:
            type: string
            children: null
          intent_code:
            type: string
            children: null
          exception_type:
            type: string
            children: null
          responsible_department:
            type: string
            children: null
          audit_summary:
            type: string
            children: null
          suggested_actions:
            type: array[string]
            children: null
          customer_reply:
            type: string
            children: null
          tool_results:
            type: object
            children: null
          rule_query:
            type: string
            children: null
          ticket_action:
            type: string
            children: null
          ticket_order_no:
            type: string
            children: null
          ticket_waybill_no:
            type: string
            children: null
        code: |
          def data_of(tool_result):
              return (tool_result or {}).get("data", {}) if isinstance(tool_result, dict) else {}

          def main(query, waybill_lookup, shipment_detail, order_detail, order_address, delivery_status, compensation):
              ship = data_of(shipment_detail)
              order = data_of(order_detail)
              delivery = data_of(delivery_status)
              comp = data_of(compensation)
              waybill = ship.get("waybill_no") or data_of(waybill_lookup).get("waybill_no") or ""
              order_no = ship.get("order_no") or order.get("order_no") or data_of(waybill_lookup).get("order_no") or ""
              audit_summary = "签收状态存在异常，需要结合签收凭证、异常原因和赔付规则进行人工复核。"
              suggested_actions = [
                  "核查签收凭证、签收人和异常签收原因",
                  "按赔付规则判断是否进入赔付审核或举证流程",
              ]
              customer_reply = "订单存在异常签收争议，系统建议先核查签收凭证与承运商举证后，再向客户反馈处理结果。"
              ticket_action = "create" if delivery.get("delivery_status") == "ABNORMAL_SIGNED" or delivery.get("abnormal_reason") or comp.get("is_compensable") else "skip"
              rule_query = f"场景: abnormal_signed; 用户问题: {query}; 签收状态: {delivery.get('delivery_status')}; 签收凭证: {delivery.get('signed_proof_type')}; 赔付金额: {comp.get('compensation_amount')}"
              return {
                  "scenario_code": "abnormal_signed",
                  "intent_code": "abnormal_signed_check",
                  "exception_type": "abnormal_signed",
                  "responsible_department": "manual_review",
                  "audit_summary": audit_summary,
                  "suggested_actions": suggested_actions,
                  "customer_reply": customer_reply,
                  "tool_results": {
                      "tms_get_waybill_by_order": waybill_lookup or {},
                      "tms_get_shipment_detail": shipment_detail or {},
                      "oms_get_order_detail": order_detail or {},
                      "oms_get_order_address": order_address or {},
                      "tms_get_delivery_status": delivery_status or {},
                      "settlement_calculate_compensation": compensation or {},
                  },
                  "rule_query": rule_query,
                  "ticket_action": ticket_action,
                  "ticket_order_no": order_no,
                  "ticket_waybill_no": waybill,
              }
      height: 126
