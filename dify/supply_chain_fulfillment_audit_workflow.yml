            type: string
            children: null
          audit_summary:
            type: string
            children: null
          suggested_actions:
            type: array[string]
            children: null
          customer_reply:
            type: string
            children: null
          rule_evidence:
            type: array[object]
            children: null
          tool_results:
            type: object
            children: null
          ticket_action:
            type: string
            children: null
